[tool.ruff]
line-length= 150
target-version="py312"

[tool.ruff.lint]
select=["E","F","I","UP","B"]

[tool.mypy]
python_version="3.12"
strict= true
ignore_missing_imports= true

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath = ["."]
asyncio_mode="auto"

#ignorer les regles pour ce fichier
[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402","I001","F401"]