services:
  api:
    build: .
    ports :
      - "8000:8000"
    volumes :
      - .:/app
    env_file :
      - .env
    depends_on :
      - db
      - redis
    networks:
      - app-network

  db :
    image : postgres:16
    environment:
      POSTGRES_USER : postgres
      POSTGRES_PASSWORD : postgres
      POSTGRES_DB : chatmpllm
    ports :
      - "5432:5432"
    volumes :
      - pgdata:/var/lib/postgresql/data
    networks :
      - app-network

  redis :
    image : redis:7
    ports :
      - "6379:6379"
    networks :
      - app-network

  nginx :
    image: nginx:alpine
    ports:
      - "80:80"
    volumes :
      - ./nginx/nginx.config:/etc/nginx.config:ro
    depends_on:
      - api
      - frontend
    networks:
      - app-network


networks:
  app-network :
    external: true

volumes:
  pgdata:


